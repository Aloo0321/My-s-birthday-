<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For My Maira 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fdf2f8; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .hidden { display: none; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { font-family: 'Caveat', cursive; color: #db2777; font-size: 3rem; }
        
        /* Memory Section */
        .memory-slot { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .memory-slot img { width: 100%; border-radius: 10px; }
        .memory-text { margin-top: 15px; font-weight: 500; color: #4b5563; font-style: italic; }
        
        /* Quiz & Cake */
        .cake-btn { font-size: 100px; cursor: pointer; transition: 0.3s; }
        .btn { background: #db2777; color: white; border: none; padding: 15px 30px; border-radius: 30px; cursor: pointer; margin: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="section-memory" class="container">
        <h1>Our Memory Lane 🌙</h1>
        <div class="memory-slot"><img src="ss1.png"><p class="memory-text">"You’re the best it gets dude"—trying to act cool about the flowers!</p></div>
        <button class="btn" onclick="showSurprise()">Ready for your Birthday Surprise? 🎁</button>
    </div>

    <div id="section-surprise" class="container hidden">
        <h1>Happy Birthday Maira! 🎂</h1>
        <div id="cake" class="cake-btn" onclick="blowOut()">🎂</div>
        <p id="hint">Tap the cake to blow out candles!</p>
        
        <div id="letter" class="hidden">
            <p>Your birthday letter text here...</p>
            <button class="btn" onclick="startQuiz()">Take the KFC Quiz! 🍔</button>
        </div>
    </div>

    <div id="section-quiz" class="container hidden">
        <h1>KFC Mighty Quiz 🍔</h1>
        <div id="quiz-content"></div>
    </div>

    <script>
        // Notification Helper
        function notify(msg) {
            fetch('https://ntfy.sh/aliyan_maira_proposal_2026', { method: 'POST', body: msg });
        }

        function showSurprise() {
            document.getElementById('section-memory').classList.add('hidden');
            document.getElementById('section-surprise').classList.remove('hidden');
            notify("Maira reached the Birthday Surprise page!");
        }

        function blowOut() {
            document.getElementById('cake').innerHTML = '🧁';
            document.getElementById('hint').innerText = "Make a wish! ✨";
            document.getElementById('letter').classList.remove('hidden');
        }

        function startQuiz() {
            document.getElementById('section-surprise').classList.add('hidden');
            document.getElementById('section-quiz').classList.remove('hidden');
            // Add quiz logic here
        }
    </script>
</body>
</html>
